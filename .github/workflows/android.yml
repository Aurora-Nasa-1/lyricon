name: Android CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 删除 Gradle 守护进程 JDK 配置
        run: |
          echo "检查并删除 Gradle 守护进程 JDK 配置..."
          if [ -f "gradle/gradle-daemon-jvm.properties" ]; then
            echo "找到配置文件, 正在删除..."
            rm -f gradle/gradle-daemon-jvm.properties
            echo "✅ 已删除 Gradle 守护进程 JDK 配置"
          else
            echo "✅ 没有找到配置文件, 无需删除"
          fi

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 修正 Gradle 配置文件
        run: |
          echo "正在修正 gradle.properties..."
          if [ -f "gradle.properties" ]; then
            sed -i 's/-XX:+CMSClassUnloadingEnabled//g' gradle.properties
            sed -i 's/-Xmx8g/-Xmx4g/g' gradle.properties
            sed -i 's/-XX:MaxMetaspaceSize=2g/-XX:MaxMetaspaceSize=1g/g' gradle.properties
            echo "✅ 修正完成"
          fi

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 确定构建类型
        id: build_type
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ github.event.inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=debug" >> $GITHUB_OUTPUT
          fi

      - name: 构建 ${{ steps.build_type.outputs.type }} APK
        run: |
          if [ "${{ steps.build_type.outputs.type }}" == "debug" ]; then
            ./gradlew :lyricon:assembleDebug
          else
            ./gradlew :lyricon:assembleRelease
          fi

      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: lyricon-${{ steps.build_type.outputs.type }}-apk
          path: lyricon/build/outputs/apk/${{ steps.build_type.outputs.type }}/**/lyricon-*${{ steps.build_type.outputs.type }}.apk
          if-no-files-found: warn

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lyricon/build/outputs/apk/release/**/lyricon-*release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: 构建结果摘要
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_TYPE="release"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          else
            BUILD_TYPE="debug"
          fi
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **事件**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支/标签**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: $BUILD_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **构建编号**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK 文件已上传到 Artifacts，可在 Actions 页面下载。" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "已自动创建 GitHub Release 并上传发布包。" >> $GITHUB_STEP_SUMMARY
          fi
